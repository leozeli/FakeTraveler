apply plugin: 'com.android.application'

android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId = "cl.coders.faketraveler"
        minSdk = 21
        compileSdk = 36
        targetSdk = 36
        versionCode = 234
        versionName = "2.3.2-fgs2"
    }
    // Public distribution key for this fork's GitHub releases. It is not the
    // upstream F-Droid key and not a local debug keystore, so an already
    // installed cl.coders.faketraveler must be uninstalled before upgrading.
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "faketraveler"
            keyAlias "faketraveler"
            keyPassword "faketraveler"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace = 'cl.coders.faketraveler'
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}
