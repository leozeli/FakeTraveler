name: Android CD

on:
  push:
    tags:
      # v2.3.2 and suffixed tags such as v2.3.2-fgs2 (versionName 2.3.2-fgs2).
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v2.3.2-fgs2)'
        required: true
        default: 'v2.3.2-fgs2'

jobs:
  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Archive App
        uses: actions/upload-artifact@v7
        with:
          path: |
            app/build/outputs/apk/release/*.apk

      - name: Prepare Changelog Path
        id: changelog_meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Fastlane changelog files are named by versionCode (234), not by
          # stripping dots from versionName (2.3.2-fgs2 -> 232-fgs2).
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$VERSION_CODE" ]; then
            echo "Could not read versionCode from app/build.gradle" >&2
            exit 1
          fi
          FILE_PATH="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -f "$FILE_PATH" ]; then
            echo "Missing changelog $FILE_PATH for versionCode $VERSION_CODE" >&2
            exit 1
          fi
          echo "path=$FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog_meta.outputs.tag }}
          name: ${{ steps.changelog_meta.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: ${{ steps.changelog_meta.outputs.path }}
